<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النصر | نظام إدارة مكتب المحاماة والدعاوى البنكية - دبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0a1120; --navy-800:#0e1a30; --navy-700:#132341; --navy-600:#1a2f56; --navy-500:#24406e;
  --gold:#c9a24b; --gold-bright:#e6c877; --gold-dim:#8a6d2f;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --blue:#3b82f6; --teal:#14b8a6; --purple:#a855f7;
  --bg:#f1f3f7; --card:#ffffff; --ink:#101828; --muted:#667085; --line:#e4e7ec;
  --shadow:0 4px 18px rgba(10,17,32,.08); --radius:14px;
  --sidebar-w:262px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#b9c0cc;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
label{font-weight:700;font-size:12.5px;color:var(--navy-700);display:block;margin-bottom:5px}
.hidden{display:none!important}

/* ============ LOGIN ============ */
#loginScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% 10%,#1a2f56 0%,#0a1120 55%),var(--navy-900);overflow:hidden}
#loginScreen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(201,162,75,.045) 0 2px,transparent 2px 90px)}
.login-card{position:relative;z-index:2;width:420px;max-width:92vw;background:linear-gradient(160deg,#132341,#0e1a30);border:1px solid rgba(201,162,75,.35);border-radius:22px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:riseIn .6s ease}
.login-logo{width:86px;height:86px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(145deg,var(--gold),#a37f31);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#0a1120;box-shadow:0 0 0 6px rgba(201,162,75,.15),0 10px 30px rgba(0,0,0,.4)}
.login-card h1{text-align:center;color:var(--gold-bright);font-size:26px;font-weight:900;letter-spacing:1px}
.login-card .sub{text-align:center;color:#9db1d3;font-size:13px;margin:6px 0 24px}
.login-card input{background:rgba(255,255,255,.06);border-color:rgba(201,162,75,.25);color:#fff;margin-bottom:14px}
.login-card input::placeholder{color:#7e93b8}
.login-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.2)}
.btn-gold{width:100%;padding:12px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#0a1120;font-weight:800;font-size:15px;transition:.2s}
.btn-gold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.login-hint{margin-top:18px;background:rgba(201,162,75,.08);border:1px dashed rgba(201,162,75,.4);border-radius:10px;padding:10px 12px;color:#c8d4ea;font-size:12px}
.login-hint b{color:var(--gold-bright)}
#loginError{color:#fca5a5;font-size:12.5px;margin-top:10px;text-align:center;min-height:18px}

/* ============ APP SHELL ============ */
#app{display:none}
.topbar{position:fixed;top:0;right:0;left:0;height:60px;background:linear-gradient(90deg,var(--navy-800),var(--navy-600));display:flex;align-items:center;gap:14px;padding:0 18px;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;font-size:18px}
.brand .blogo{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--gold),#a37f31);display:flex;align-items:center;justify-content:center;color:#0a1120;font-weight:900;font-size:17px;box-shadow:0 0 0 3px rgba(201,162,75,.2)}
.brand small{display:block;color:var(--gold-bright);font-size:10.5px;font-weight:600;letter-spacing:.5px}
.topbar .spacer{flex:1}
.clock{color:#c8d4ea;font-size:12.5px;background:rgba(255,255,255,.06);padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.userchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:5px 12px 5px 8px;border-radius:30px;color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-bright),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a1120;font-size:13px}
.userchip .uname{font-size:13px;font-weight:700;line-height:1.2}
.userchip .urole{font-size:10.5px;color:var(--gold-bright)}
.btn-logout{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700}
.btn-logout:hover{background:rgba(239,68,68,.3)}

.sidebar{position:fixed;top:60px;right:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,var(--navy-900),var(--navy-800));padding:14px 10px;overflow-y:auto;z-index:90;border-left:1px solid rgba(201,162,75,.15)}
.nav-sec{color:#6e82a8;font-size:10.5px;font-weight:800;letter-spacing:1px;margin:16px 8px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:none;color:#c3cfe6;padding:10px 13px;border-radius:11px;font-size:13.8px;font-weight:600;text-align:right;margin-bottom:2px;transition:.18s;position:relative}
.nav-item .ic{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.nav-item:hover{background:rgba(201,162,75,.12);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(201,162,75,.22),rgba(201,162,75,.06));color:var(--gold-bright);font-weight:800}
.nav-item.active .ic{background:rgba(201,162,75,.25)}
.nav-item .badge-n{margin-right:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:1px 8px}

.main{margin:60px 0 0 var(--sidebar-w);padding:22px;min-height:calc(100vh - 60px)}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:21px;font-weight:900;color:var(--navy-800)}
.page-head h2::before{content:"";display:inline-block;width:5px;height:22px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-radius:4px;margin-left:10px;vertical-align:-3px}
.page-head .desc{width:100%;color:var(--muted);font-size:13px}
.page-head .actions{margin-right:auto;display:flex;gap:8px}

/* ============ COMPONENTS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{font-size:15.5px;font-weight:800;color:var(--navy-800);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.sidebar{display:none}.main{margin-right:0}}

.kpi{position:relative;border-radius:var(--radius);padding:16px 18px;color:#fff;overflow:hidden;box-shadow:var(--shadow)}
.kpi .k-icon{position:absolute;left:-6px;top:-6px;font-size:64px;opacity:.14}
.kpi .k-label{font-size:12.5px;opacity:.85;font-weight:600}
.kpi .k-val{font-size:26px;font-weight:900;margin-top:2px}
.kpi .k-sub{font-size:11px;opacity:.75;margin-top:3px}
.kpi.navy{background:linear-gradient(135deg,#1a2f56,#0e1a30)}
.kpi.gold{background:linear-gradient(135deg,#b8923c,#8a6d2f)}
.kpi.green{background:linear-gradient(135deg,#16a34a,#15803d)}
.kpi.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.kpi.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.kpi.purple{background:linear-gradient(135deg,#9333ea,#7e22ce)}
.kpi.teal{background:linear-gradient(135deg,#0d9488,#0f766e)}
.kpi.amber{background:linear-gradient(135deg,#d97706,#b45309)}

.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;transition:.18s;background:var(--navy-600);color:#fff}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#0a1120}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy-700)}
.btn.ghost:hover{border-color:var(--gold);background:#fffdf5}
.btn.danger{background:var(--red)}
.btn.small{padding:5px 11px;font-size:12px;border-radius:8px}

.badge{display:inline-block;padding:2px 11px;border-radius:20px;font-size:11px;font-weight:800}
.b-green{background:#dcfce7;color:#15803d} .b-red{background:#fee2e2;color:#b91c1c} .b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8} .b-purple{background:#f3e8ff;color:#7e22ce} .b-gray{background:#eef1f5;color:#475467}
.b-gold{background:#f6ecd2;color:#8a6d2f}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:var(--navy-800);color:#e8dcb8;padding:10px 12px;text-align:right;font-size:12.3px;position:sticky;top:0;z-index:2}
table.tbl th:first-child{border-radius:0 10px 0 0}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:hover td{background:#faf7ee}
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);max-height:70vh}
.tbl-wrap.small{max-height:52vh}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:10px 10px 0 0;border:1.5px solid var(--line);border-bottom:none;background:#fff;font-weight:700;font-size:13px;color:var(--muted)}
.tab.active{background:var(--navy-800);color:var(--gold-bright);border-color:var(--navy-800)}

.modal-bg{position:fixed;inset:0;background:rgba(10,17,32,.62);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:18px;width:760px;max-width:96vw;box-shadow:0 30px 90px rgba(0,0,0,.4);animation:riseIn .3s ease;margin-bottom:40px}
.modal.wide{width:1000px}
.modal-head{display:flex;align-items:center;background:linear-gradient(90deg,var(--navy-800),var(--navy-600));color:#fff;padding:14px 20px;border-radius:18px 18px 0 0}
.modal-head h3{font-size:16px;font-weight:800;color:var(--gold-bright)}
.modal-head button{margin-right:auto;background:rgba(255,255,255,.1);border:none;color:#fff;width:30px;height:30px;border-radius:8px;font-size:15px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start}

.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:900;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-800);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);border-right:4px solid var(--gold);animation:riseIn .3s ease}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}

.field{margin-bottom:12px}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:640px){.frow{grid-template-columns:1fr}}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff;transition:.2s}
.chk:hover{border-color:var(--gold)}
.chk input[type=checkbox]{width:19px;height:19px;accent-color:#b8923c;margin-top:3px;flex-shrink:0;cursor:pointer}
.chk .chk-t{font-weight:700;font-size:13.2px}
.chk.done{background:#f2fbf5;border-color:#bbe7c9}
.chk.done .chk-t{text-decoration:line-through;color:#15803d}
.chk .chk-meta{font-size:11.5px;color:var(--muted)}
.progress{height:9px;background:#e9edf3;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:20px;transition:width .4s}
.progress-bar-wrap{display:flex;align-items:center;gap:10px;margin:8px 0}
.progress-bar-wrap span{font-size:12px;font-weight:800;color:var(--navy-700)}

/* stage timeline */
.stages{display:flex;gap:0;overflow-x:auto;padding:6px 0 14px}
.stage{min-width:150px;flex:1;position:relative;padding:12px 26px 12px 8px}
.stage::before{content:"";position:absolute;top:24px;right:14px;left:-6px;height:3px;background:var(--line)}
.stage:first-child::before{display:none}
.stage .s-dot{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--muted);position:relative;z-index:2;margin-bottom:8px}
.stage.active .s-dot{border-color:var(--gold);background:var(--navy-800);color:var(--gold-bright);box-shadow:0 0 0 5px rgba(201,162,75,.18)}
.stage.done .s-dot{border-color:var(--green);background:var(--green);color:#fff}
.stage .s-t{font-weight:800;font-size:12.3px;color:var(--navy-800)}
.stage .s-d{font-size:10.8px;color:var(--muted)}

/* accordion */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-h{width:100%;text-align:right;background:#fff;border:none;padding:13px 16px;font-weight:800;font-size:14px;color:var(--navy-800);display:flex;align-items:center;gap:10px}
.acc-h:hover{background:#faf7ef}
.acc-h .chev{margin-right:auto;transition:.25s;color:var(--gold)}
.acc.open .acc-h{background:linear-gradient(90deg,#faf5e8,#fff)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px}
.acc.open .acc-b{max-height:2600px;padding:0 16px 16px}

.copy-box{position:relative;background:#f8f9fb;border:1px solid var(--line);border-radius:11px;padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.9;max-height:420px;overflow-y:auto}
.copy-btn{position:absolute;top:9px;left:9px}

.alert{border-radius:11px;padding:12px 15px;font-size:13px;font-weight:600;margin-bottom:14px;border:1px solid}
.alert.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.alert.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.alert.danger{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.alert.gold{background:#fdf8ec;border-color:#e8d5a0;color:#7c6124}

.bank-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;cursor:pointer;transition:.2s;position:relative}
.bank-card:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(201,162,75,.15);transform:translateY(-2px)}
.bank-card .bk-name{font-weight:900;font-size:14.5px;color:var(--navy-800)}
.bank-card .bk-en{font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.bank-card .bk-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}

.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-line b{color:var(--navy-800)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.empty .e-ic{font-size:42px;margin-bottom:8px;opacity:.5}

/* chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 4px 0}
.bars .bar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars .bar{width:70%;max-width:52px;background:linear-gradient(180deg,var(--gold-bright),var(--gold-dim));border-radius:7px 7px 0 0;min-height:4px;transition:height .6s;position:relative}
.bars .bar span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--navy-700)}
.bars .bar-l{font-size:11px;color:var(--muted);font-weight:700;text-align:center}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:160px;height:160px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut .d-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.donut .d-center b{font-size:24px;font-weight:900;color:var(--navy-800)}
.donut .d-center small{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-left:6px}

.role-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:.2s}
.role-card:hover{border-color:var(--gold)}
.role-card .r-head{padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px}
.role-card .r-head .r-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:21px}
.role-card .r-head .r-t{font-weight:900;font-size:15px}
.role-card .r-head .r-s{font-size:11px;opacity:.85}
.role-card .r-body{padding:14px 16px}

.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input,.searchbar select{width:auto;min-width:180px;flex:1;max-width:320px}

.task-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:none}

.law-item{border-right:4px solid var(--gold);background:#fbf9f3;border-radius:10px;padding:12px 15px;margin-bottom:10px}
.law-item .l-t{font-weight:800;font-size:13.5px;color:var(--navy-800)}
.law-item .l-d{font-size:12.5px;color:#4b5563;margin-top:4px}
.law-item .l-tag{font-size:10.5px;background:var(--gold);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700}

.pill{display:inline-flex;align-items:center;gap:6px;background:#f2f4f8;border:1px solid var(--line);border-radius:20px;padding:4px 13px;font-size:12px;font-weight:700;color:var(--navy-700);cursor:pointer}
.pill:hover{border-color:var(--gold);background:#fdf8ec}
.pill.on{background:var(--navy-800);color:var(--gold-bright);border-color:var(--navy-800)}

.template-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;margin-bottom:13px}
.template-card .t-head{display:flex;align-items:center;gap:10px;padding:11px 15px;background:linear-gradient(90deg,#faf5e8,#fff);border-bottom:1px solid var(--line)}
.template-card .t-head b{font-size:13.8px;color:var(--navy-800)}
.template-card .t-head .t-actions{margin-right:auto;display:flex;gap:6px}
.template-card .t-body{padding:13px 15px;font-size:12.8px;max-height:240px;overflow:hidden;position:relative;white-space:pre-wrap;line-height:1.9;color:#374151}
.template-card .t-body.open{max-height:none}
.template-card .t-fade{position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(transparent,#fff)}

.perm-matrix td,.perm-matrix th{font-size:12px;text-align:center}
.perm-matrix td:first-child{text-align:right;font-weight:700}
.yes{color:var(--green);font-weight:900} .no{color:#cbd2dd;font-weight:900}

@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:riseIn .35s ease}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}

@media print{
  .sidebar,.topbar,.no-print,.page-head .actions{display:none!important}

  body:"السادة البنك الموقر — [اسم البنك]\nالموضوع: اعتراض رسمي على الرسوم والفوائد المحملة على البطاقة المنتهية بـ [آخر 4 أرقام] — [اسم صاحب البطاقة]\n\nتحية طيبة وبعد،\n\nبالإشارة إلى حسابي/بطاقتي الائتمانية المشار إليها أعلاه، أود تقديم اعتراضي الرسمي على الرسوم والفوائد التالية:\n1. رسوم بقيمة [المبلغ] درهم بتاريخ [التاريخ] — غير متفق عليها في العقد.\n2. فوائد بقيمة [المبلغ] درهم — محسوبة فوق السعر المعلن.\n3. [أي رسوم أخرى].\n\nأرفق نسخًا من كشف الحساب والعقد و[المستندات].\n\nأطلب ما يلي:\n- إلغاء الرسوم الزائدة وإعادة احتساب الرصيد وفق العقد.\n- تزويدي بكشف حساب تفصيلي لكل الرسوم والفوائد من تاريخ الإصدار.\n- الرد كتابيًا خلال المهلة النظامية (15 يوم عمل) وفق معايير حماية المستهلك للمصرف المركزي.\n\nأُنبه إلى أن عدم المعالجة سيتيح لي التصعيد إلى سندك (وحدة أمين المظالم) واتخاذ الإجراءات القانونية.\n\nوتفضلوا بقبول فائق الاحترام،\n[اسم العميل]\nرقم الاتصال: [الهاتف] | تاريخ: [التاريخ]\nالمرفقات: [قائمة المرفقات]"},

 {id:"T05", cat:"رد على إنذار", title:"رد على إنذار/إخطار قانوني من البنك أو محامي البنك", to:"[بريد محامي/البنك]", subject:"رد رسمي على الإنذار القانوني المورِّد بتاريخ [التاريخ] — [اسم العميل]",

  body:"حضرات السادة المحترمين،\nالموضوع: رد على التهديد بإجراءات جنائية — [اسم العميل]\n\nتحية طيبة وبعد،\n\nبالإشارة إلى تهديدكم بتوجيه إجراءات جنائية بشأن الشيك المقدم كضمان لالتزام ائتماني تجاري، ننبه إلى ما يلي:\n\n1. بموجب المرسوم بقانون اتحادي رقم (50) لسنة 2022، أصبح سداد الشيك مسارًا مدنيًا/تنفيذيًا في معظم الحالات، ولم يعد العجز عن السداد جريمة جنائية تلقائية.\n2. الشيك المذكور ضمان لالتزام تجاري ولا يمكن استخدامه وسيلة تهديد أو ضغط.\n3. أي استخدام للتهديد أو التضييق على حركة العميل دون سند قضائي سيتضمن ردًا قانونيًا كاملًا، ومن بين ذلك الشكوى إلى المصرف المركزي وسندك والمطالبة بالتعويض.\n\nنكرر عرضنا للتسوية الودية [التفاصيل]، ونحتفظ بكامل حقوق عميلنا.\n\nوتفضلوا بقبول فائق الاحترام،\nمكتب النصر للمحاماة — دبي"},

function buildNav(){
  const sb = document.getElementById("sidebar"); let h="", lastGroup=null;
  SECTIONS.forEach(s=>{
    if(s.perm && !can(s.perm)) return;
    if(s.perm==="all" && !can("all")) return;
    if(s.group!==lastGroup){ h+=`<div class="nav-sec">${s.group}</div>`; lastGroup=s.group; }
    const n = s.id==="tasks" ? DB.tasks.filter(t=>t.assignee===CUR.u && t.status!=="منجزة").length : 0;

function donutStatus(cs){
  const cats = [{"k":"جديدة","c":"#3b82f6"},{"k":"قيد الإجراء","c":"#f59e0b"},{"k":"مراسلات جارية","c":"#c9a24b"},{"k":"تسوية قائمة","c":"#a855f7"},{"k":"تقاضي","c":"#ef4444"},{"k":"مغلقة-ناجحة","c":"#22c55e"},{"k":"مغلقة","c":"#94a3b8"}];
  const counts = cats.map(x=>({...x,n:cs.filter(c=>c.status===x.k).length}));
  const tot = counts.reduce((a,x)=>a+x.n,0);
  if(!tot) return `<div class="empty"><div class="e-ic">⚖️</div>لا توجد قضايا بعد</div>`;
  let acc=0, segs="";
  counts.forEach(x=>{ if(!x.n) return; const from=acc/tot*360, to=(acc+x.n)/tot*360; acc+=x.n;
    segs += `${x.c} ${from}deg ${to}deg, `; });
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${segs.slice(0,-2)})"><div class="d-center"><b class="num">${tot}</b><small>قضية</small></div></div>
    <div class="legend">${counts.filter(x=>x.n).map(x=>`<div><i style="background:${x.c}"></i>${x.k}: <b>${x.n}</b></div>`).join("")}</div></div>`;
}

      <div class="card"><h3><span class="dot"></span>قائمة تحقق المرحلة الحالية — ${cur.t}</h3>
        <div class="progress-bar-wrap"><div class="progress" style="flex:1"><i id="chkBar"></i></div><span id="chkPct"></span></div>
        <div id="chkList"></div></div>
    </div>
    <div class="card"><h3><span class="dot"></span>ملاحظات الملف</h3><p style="white-space:pre-wrap;font-size:13.5px">${esc(c.notes||"—")}</p></div>
  `, `
    <button class="btn ghost" onclick="printArea()">🖨️ طباعة الملف</button>
    ${can("all")?`<button class="btn ghost" onclick="closeModal();caseForm('${c.id}')">✏️ تعديل</button>
    <button class="btn primary" onclick="advanceStage('${c.id}')">➡️ إنهاء المرحلة والانتقال للتالية</button>`:""}
    <button class="btn ghost" onclick="closeModal()">إغلاق</button>`, true);
  renderCaseChecklist(c);
}
function renderCaseChecklist(c){
  const cur = STAGES[c.stage-1];
  const doneCount = cur.checklist.filter((_,i)=>c.progress?.[c.stage+"-"+i]?.done).length;
  const pct = Math.round(doneCount/cur.checklist.length*100);
  const bar = document.getElementById("chkBar"), pctEl = document.getElementById("chkPct");
  if(bar){ bar.style.width = pct+"%"; pctEl.textContent = pct+"%"; }
  const el = document.getElementById("chkList"); if(!el) return;
  el.innerHTML = cur.checklist.map((t,i)=>{
    const key = c.stage+"-"+i, done = c.progress?.[key]?.done;
    return `<label class="chk ${done?"done":""}"><input type="checkbox" ${done?"checked":""} ${can("all")?"":"disabled"} onchange="toggleChk('${c.id}',${c.stage},${i},this.checked)"><div><div class="chk-t">${esc(t)}</div></div></label>`;
  }).join("");
}
function toggleChk(cid, st, i, on){
  const c = caseById(cid); c.progress = c.progress||{}; c.progress[st+"-"+i] = {done:on}; saveDB();
  renderCaseChecklist(c);
}
function advanceStage(cid){
  const c = caseById(cid); const cur = STAGES[c.stage-1];
  const all = cur.checklist.every((_,i)=>c.progress?.[c.stage+"-"+i]?.done);
  if(!all && !confirm("ليست كل خطوات المرحلة مكتملة — متابعة الانتقال؟")) return;
  if(c.stage<10){ c.stage++; logAct("انتقال القضية "+cid+" إلى المرحلة "+c.stage); }
  else { toast("الملف في المرحلة الأخيرة — أغلقه من تعديل الحالة","err"); return; }
  saveDB(); closeModal(); caseDetail(cid);
}

function pgCalc(){
  return `
  <div class="page-head"><h2>حاسبة المديونية — أداة المحاسب</h2>
    <div class="desc">فصل دقيق: أصل الدين، الفوائد النظامية، الرسوم، والمبالغ المخالفة القابلة للإلغاء — وفق عقد البطاقة ومعايير حماية المستهلك</div></div>
  <div class="grid g2">
    <div class="card"><h3><span class="dot"></span>المدخلات</h3>
      <div class="field"><label>اسم العميل / ملف القضية</label><input id="dcName" placeholder="مثال: CS-100001"></div>
      <div class="frow">
        <div class="field"><label>أصل الدين — الإنفاق الفعلي (درهم)</label><input id="dcPrincipal" type="number" value="0"></div>
        <div class="field"><label>نسبة الفائدة الشهرية % (من العقد)</label><input id="dcRate" type="number" step="0.01" value="3.25"></div>
      </div>
      <div class="frow">
        <div class="field"><label>عدد الشهور المتأخرة/المحتسبة</label><input id="dcMonths" type="number" value="0"></div>
        <div class="field"><label>رسوم تأخير شهرية محصلة (درهم)</label><input id="dcLate" type="number" value="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>رسوم أخرى (سنوية/تأمين/صرف) (درهم)</label><input id="dcFees" type="number" value="0"></div>
        <div class="field"><label>خصومات غير مصرح بها قابلة للاسترداد (درهم)</label><input id="dcIllegal" type="number" value="0"></div>
      </div>
      <div class="frow">
        <div class="field"><label>ما سدده العميل بالفعل (درهم)</label><input id="dcPaid" type="number" value="0"></div>
        <div class="field"><label>نسبة التسوية المستهدفة %</label><input id="dcTarget" type="number" value="60"></div>
      </div>
      <button class="btn primary" style="width:100%" onclick="runCalc()">🧮 احسب المديونية</button></div>
    <div class="card" id="calcOut"><div class="empty"><div class="e-ic">🧮</div>أدخل البيانات واضغط احسب</div></div>
  </div>`;
}
function initCalc(){ /* ready */ }
function runCalc(){
  const P = num("dcPrincipal"), r = num("dcRate")/100, m = num("dcMonths");
  const late = num("dcLate"), fees = num("dcFees"), illegal = num("dcIllegal"), paid = num("dcPaid"), target = num("dcTarget");
  const name = val("dcName")||"—";
  let bal = P, intTotal = 0, rows = "";
  for(let i=0;i<Math.min(m,120);i++){ const it = bal*r; intTotal+=it; bal = bal + it; }
  intTotal = Math.round(intTotal); bal = Math.round(bal);
  const bankClaim = bal + late + fees + illegal;
  const legalClaim = P + intTotal;
  const excess = bankClaim - legalClaim;
  const net = Math.max(bankClaim - paid, 0);
  const settlement = Math.round(net * target/100);
  const fee = Math.max(Math.round(net * DB.settings.feePercent/100), DB.settings.minFee);
  document.getElementById("calcOut").innerHTML = `
    <h3><span class="dot"></span>النتيجة — ${esc(name)}</h3>
    <div class="stat-line"><span>أصل الدين</span><b class="num">${fmt(P)} درهم</b></div>
    <div class="stat-line"><span>الفوائد المحتسبة (${(r*100).toFixed(2)}% شهري × ${m} شهر)</span><b class="num">${fmt(intTotal)} درهم</b></div>
    <div class="stat-line"><span>الرسوم المتأخرة المحصلة</span><b class="num">${fmt(late)} درهم</b></div>
    <div class="stat-line"><span>رسوم أخرى</span><b class="num">${fmt(fees)} درهم</b></div>
    <div class="stat-line"><span>خصومات غير مصرح بها</span><b class="num" style="color:var(--red)">${fmt(illegal)} درهم</b></div>
    <div class="stat-line"><span>مسدَّد من العميل</span><b class="num" style="color:var(--green)">-${fmt(paid)} درهم</b></div>
    <div class="stat-line" style="background:#fdf8ec;margin-top:8px;border-radius:8px;padding:10px"><span><b>المطلوب من البنك (صافي)</b></span><b class="num" style="font-size:17px">${fmt(net)} درهم</b></div>
    <div class="stat-line"><span>مطالبة البنك الظاهرة</span><b class="num">${fmt(bankClaim)} درهم</b></div>
    <div class="stat-line"><span>السند النظامي (أصل + فوائد)</span><b class="num">${fmt(legalClaim)} درهم</b></div>
    <div class="stat-line" style="background:#fef2f2;border-radius:8px;padding:10px"><span><b>الفائض المخالف القابل للإلغاء</b></span><b class="num" style="color:var(--red);font-size:16px">${fmt(Math.max(excess,0))} درهم</b></div>
    <div class="stat-line"><span>هدف التسوية (${target}%)</span><b class="num">${fmt(settlement)} درهم</b></div>
    <div class="stat-line"><span>أتعاب المكتب المقترحة (${DB.settings.feePercent}% — حد أدنى ${fmt(DB.settings.minFee)})</span><b class="num">${fmt(fee)} درهم</b></div>
    <button class="btn ghost" style="margin-top:12px" onclick="window.print()">🖨️ طباعة الحساب</button>`;
  toast("تم الحساب","ok");
}

  return `

    <div class="desc">الإجراء الواجب اتخاذه مع كل حالة — إلزامي على جميع الموظفين</div></div>
  ${GUIDELINE.map(g=>`<div class="card"><h3><span class="dot"></span>${esc(g.t)}</h3>
    ${g.items.map((x,i)=>`<div class="chk" style="cursor:default"><span class="badge b-gold">${i+1}</span><div class="chk-t">${esc(x)}</div></div>`).join("")}</div>`).join("")}
  <div class="card"><h3><span class="dot"></span>الإجراء الإلزامي حسب حالة العميل — خريطة سريعة</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الحالة</th><th>الإجراء الواجب فورًا</th><th>القالب</th><th>المسؤول الأول</th></tr></thead><tbody>
    ${ALL_CASE_TYPES().map(ct=>`<tr><td><b>${esc(ct.t)}</b></td><td style="font-size:12.5px">${esc(ct.steps[0])} ← ${esc(ct.steps[1])}</td>
      <td><span class="badge b-gold">${(ct.steps.find(s=>/T\d\d/.test(s))||"").match(/T\d\d/)?.[0]||"T01"}</span></td>
      <td>${esc(ct.urgency==="عاجلة جدًا"?"المستشار + الاستقبال":"الاستقبال")}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

/* ============ الإدارة والمستخدمون ============ */
function pgAdmin(){
  return `
  <div class="page-head"><h2>الإدارة والمستخدمون — صلاحيات كاملة للمستشار عبدالرحمن نصر</h2>
    <div class="actions"><button class="btn primary" onclick="userForm()">➕ مستخدم جديد</button></div>
    <div class="desc">إدارة الحسابات والصلاحيات وإعدادات المكتب وسجل النشاط الكامل</div></div>
  <div class="card"><h3><span class="dot"></span>المستخدمون</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>اسم الدخول</th><th>الدور</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${DB.users.map((u,i)=>`<tr><td><b>${esc(u.name)}</b></td><td class="num">${esc(u.u)}</td>
      <td><span class="badge ${u.role==="manager"?"b-gold":"b-gray"}">${esc(roleOf(u.role)?.t||u.role)}</span></td>
      <td><span class="badge ${u.active?"b-green":"b-red"}">${u.active?"نشط":"موقوف"}</span></td>
      <td style="white-space:nowrap">
        <button class="btn small ghost" onclick="userForm(${i})">✏️</button>
        <button class="btn small ${u.active?"danger":"ghost"}" onclick="toggleUser(${i})">${u.active?"⏸️ إيقاف":"▶️ تفعيل"}</button></td></tr>`).join("")}
    </tbody></table></div></div>
  <div class="grid g2">
    <div class="card"><h3><span class="dot"></span>مصفوفة الصلاحيات</h3>
      <div class="tbl-wrap"><table class="tbl perm-matrix"><thead><tr><th>القسم</th><th>استقبال</th><th>إداري</th><th>باحث</th><th>محاسب</th><th>المستشار</th></tr></thead><tbody>
      ${[["العملاء: عرض",1,1,1,1,1],["العملاء: إضافة",1,0,0,0,1],["العملاء: تعديل",0,1,0,0,1],["المستندات والمراسلات",0,1,1,0,1],["التحليل القانوني",0,0,1,0,1],["الحسابات والمديونية",0,0,0,1,1],["المالية والأتعاب",0,0,0,1,1],["القوالب: عرض",1,1,1,1,1],["القوالب: تعديل",0,0,1,0,1],["المهام",1,1,1,1,1],["إدارة المستخدمين",0,0,0,0,1],["إعدادات النظام",0,0,0,0,1]]
      .map(row=>`<tr>${row.map((c,i)=>i===0?`<td>${esc(c)}</td>`:`<td class="${c?"yes":"no"}">${c?"✔":"✘"}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <div class="alert gold" style="margin-top:10px">المستشار عبدالرحمن نصر يملك <b>كافة الصلاحيات</b> بلا استثناء — وهو الجهة الوحيدة المخوّلة بإدارة المستخدمين والاعتمادات.</div></div>
    <div class="card"><h3><span class="dot"></span>إعدادات المكتب</h3>
      <div class="field"><label>اسم المكتب</label><input id="stOffice" value="${esc(DB.settings.office)}"></div>
      <div class="field"><label>المدير المسؤول</label><input id="stManager" value="${esc(DB.settings.manager)}"></div>
      <div class="frow">
        <div class="field"><label>نسبة الأتعاب % (على النجاح)</label><input id="stFee" type="number" value="${DB.settings.feePercent}"></div>
        <div class="field"><label>الحد الأدنى للأتعاب (درهم)</label><input id="stMin" type="number" value="${DB.settings.minFee}"></div>
      </div>
      <button class="btn primary" onclick="saveSettings()">💾 حفظ الإعدادات</button></div>
  </div>
  <div class="card"><h3><span class="dot"></span>سجل النشاط الكامل (آخر 300 إجراء)</h3>
    ${DB.logs.length?`<div class="tbl-wrap small"><table class="tbl"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th></tr></thead><tbody>
    ${DB.logs.map(l=>`<tr><td class="num">${esc(l.t)}</td><td>${esc(l.u)}</td><td>${esc(l.txt)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">لا يوجد نشاط</div>`}</div>`;
}
function saveSettings(){
  DB.settings.office = val("stOffice"); DB.settings.manager = val("stManager");
  DB.settings.feePercent = num("stFee")||10; DB.settings.minFee = num("stMin")||0;
  saveDB(); logAct("تعديل إعدادات النظام"); toast("تم حفظ الإعدادات","ok");
}
function userForm(i){
  const u = i!=null?DB.users[i]:null;
  openModal(u?"تعديل مستخدم":"مستخدم جديد", `
    <div class="frow">
      <div class="field"><label>الاسم الكامل *</label><input id="ufName" value="${u?esc(u.name):""}"></div>
      <div class="field"><label>اسم الدخول *</label><input id="ufUser" value="${u?esc(u.u):""}" ${u?"readonly":""}></div>
    </div>
    <div class="frow">
      <div class="field"><label>كلمة المرور *</label><input id="ufPass" value="${u?esc(u.p):""}"></div>
      <div class="field"><label>الدور</label><select id="ufRole">${ROLES.map(r=>`<option value="${r.id}" ${u&&u.role===r.id?"selected":""}>${esc(r.t)}</option>`).join("")}</select></div>
    </div>
  `, `<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveUser(${i!=null?i:"null"})">💾 حفظ</button>`);
}
function saveUser(i){
  if(!val("ufName")||!val("ufUser")||!val("ufPass")){ toast("أكمل كل الحقول","err"); return; }
  const data = {name:val("ufName"), u:val("ufUser").toLowerCase(), p:val("ufPass"), role:val("ufRole"), active:true};
  if(i!=null&&DB.users[i]) DB.users[i] = {...DB.users[i], ...data, u:DB.users[i].u};
  else { if(DB.users.some(x=>x.u===data.u)){ toast("اسم الدخول مستخدم","err"); return; } DB.users.push(data); }
  logAct("حفظ مستخدم: "+data.name); saveDB(); closeModal(); toast("تم الحفظ","ok"); go("adminsec");
}
function toggleUser(i){ const u = DB.users[i]; if(u.u==="nasser"&&u.role==="manager"){ toast("لا يمكن إيقاف حساب مدير المكتب","err"); return; }
  u.active = !u.active; saveDB(); logAct((u.active?"تفعيل":"إيقاف")+" مستخدم: "+u.name); go("adminsec"); }

function autoLogin(){
  const s = sessionStorage.getItem("alnasr_cur"); if(!s) return;
  const u = DB.users.find(x=>x.u===JSON.parse(s).u); if(!u) return;
  CUR = u;
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("uName").textContent = u.name;
  document.getElementById("uRole").textContent = roleOf(u.role) ? roleOf(u.role).t : u.role;
  document.getElementById("uAvatar").textContent = u.name.trim().charAt(0);
  buildNav(); go("dashboard");
}

/* ============ INIT ============ */
loadDB();
window.addEventListener("DOMContentLoaded", ()=>{
  setInterval(()=>{ const c = document.getElementById("clock");
    if(c) c.textContent = new Date().toLocaleString("ar-AE",{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}); },1000);
  document.getElementById("loginPass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  autoLogin();
});
</script>
</body>
</html>
